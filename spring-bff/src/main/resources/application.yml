# Base #############################################################################################
bff-scheme: ${SCHEME_BFF:http}
bff-container-name: ${CONTAINER_NAME_BFF:localhost}
bff-prefix: ${PREFIX_BFF:/bff}
# Reverse Proxy ####################################################################################
reverse-proxy-scheme: ${SCHEME_REVERSE_PROXY:http}
reverse-proxy-port: ${PORT_REVERSE_PROXY:7080}
reverse-proxy-container-name: ${CONTAINER_NAME_REVERSE_PROXY:localhost}
reverse-proxy-uri: ${reverse-proxy-scheme}://${reverse-proxy-container-name}:${reverse-proxy-port}
# Authorization Server #############################################################################
auth-server-prefix: ${AUTH_PREFIX:/auth}
auth-server-issuer: ${AUTH_ISSUER:/realms/local-keycloak}
issuer: ${reverse-proxy-uri}${auth-server-prefix}${auth-server-issuer}
# TODO: what should this actually be...
client-id: ${BFF_CLIENT_ID}
client-secret: ${BFF_CLIENT_SECRET}
# Resource Server ##################################################################################
resource-port: ${PORT_RESOURCE_SERVER:7084}
resource-scheme: ${SCHEME_RESOURCE_SERVER:http}
resource-container-name: ${CONTAINER_NAME_RESOURCE:localhost}
resource-prefix: ${PREFIX_RESOURCE:/api}
# Ooz Server #######################################################################################
ooz-port: ${PORT_OOZ:7085}
ooz-scheme: ${SCHEME_OOZ:http}
ooz-container-name: ${CONTAINER_NAME_OOZ:localhost}
ooz-prefix: ${PREFIX_OOZ:/ooz}
# Decks Server #####################################################################################
dck-port: ${PORT_DECKS:7086}
dck-scheme: ${SCHEME_DECKS:http}
dck-container-name: ${CONTAINER_NAME_DECKS:localhost}
dck-prefix: ${PREFIX_DECKS:/dck}
# Comms Server ####################################################################################
# The abuse and contact desk. Its public intake is on outpostmessaging.com and never comes through
# here; this route is only the desk, which is one signed-in person reading what arrived.
cms-port: ${PORT_CMS:7088}
cms-scheme: ${SCHEME_CMS:http}
cms-container-name: ${CONTAINER_NAME_CMS:localhost}
cms-prefix: ${PREFIX_CMS:/cms}
# Sticker Server ###################################################################################
jps-port: ${PORT_JPS:7087}
jps-scheme: ${SCHEME_JPS:http}
jps-container-name: ${CONTAINER_NAME_JPS:localhost}
jps-prefix: ${PREFIX_JPS:/jps}
# Application Properties ###########################################################################
server:
  port: ${PORT_BFF:7081}
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:false}      # HTTPS only in production
        http-only: ${COOKIE_HTTP_ONLY:true} # Prevent JavaScript access
        same-site: ${COOKIE_SAME_SITE:lax}  # Safari compatibility + CSRF protection
# Multi-domain logins ##############################################################################
# Public origins this BFF is allowed to send a user back to after login. An
# origin that is not listed falls back to client-uri, so a forged Host cannot
# retarget the flow. Every entry must ALSO be registered on the Keycloak client
# as a valid redirect URI — this list is the first of two gates, not the only one.
bff:
  allowed-client-origins: ${BFF_ALLOWED_ORIGINS:}
# Security #########################################################################################
spring:
  # Sticker photos (up to 8MB) are proxied to jpss-resource through this
  # gateway. The route streams the body rather than decoding it, but the
  # default 256KB codec buffer is small enough to be worth raising explicitly
  # rather than discovering at the first large upload.
  codec:
    max-in-memory-size: 12MB
  security:
    oauth2:
      client:
        provider:
          local-keycloak:
            issuer-uri: ${issuer}
        registration:
          local-keycloak:
            provider: local-keycloak
            authorization-grant-type: authorization_code
            client-id: ${client-id}
            client-secret: ${client-secret}
            scope: openid,profile,email,offline_access
  # Gateway Routes ###################################################################################
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: bff
              uri: ${resource-scheme}://${resource-container-name}:${resource-port}
              predicates:
                - Path=${resource-prefix}/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - TokenRelay=
                - SaveSession
                - StripPrefix=1
            - id: ooz
              uri: ${ooz-scheme}://${ooz-container-name}:${ooz-port}
              predicates:
                - Path=${ooz-prefix}/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - TokenRelay=
                - SaveSession
                - StripPrefix=1
            - id: dck
              uri: ${dck-scheme}://${dck-container-name}:${dck-port}
              predicates:
                - Path=${dck-prefix}/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - TokenRelay=
                - SaveSession
                - StripPrefix=1
            - id: cms
              uri: ${cms-scheme}://${cms-container-name}:${cms-port}
              predicates:
                - Path=${cms-prefix}/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - TokenRelay=
                - SaveSession
                - StripPrefix=1
            - id: jps
              uri: ${jps-scheme}://${jps-container-name}:${jps-port}
              predicates:
                - Path=${jps-prefix}/**
              filters:
                - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
                - TokenRelay=
                - SaveSession
                - StripPrefix=1
# Addons ###########################################################################################
com:
  c4-soft:
    springaddons:
      oidc:
        ops:
          - iss: ${issuer}
            authorities:
              - path: ${AUTH_AUTHORITIES_JSON:$.realm_access.roles}
            aud: ${AUTH_AUDIENCE:}
        client:
          client-uri: ${reverse-proxy-uri}${bff-prefix}
          security-matchers:
            - ${resource-prefix}/**
            - ${ooz-prefix}/**
            - ${dck-prefix}/**
            - ${jps-prefix}/**
            - ${cms-prefix}/**
            - /login/**
            - /oauth2/**
            - /logout
          permit-all:
            - ${resource-prefix}/**
            - ${ooz-prefix}/**
            - ${dck-prefix}/**
            - ${jps-prefix}/**
            - ${cms-prefix}/**
            - /login/**
            - /oauth2/**
          # Guards against open redirect on post_login_success_uri /
          # X-POST-LOGOUT-SUCCESS-URI. Defaults to "any path under client-uri",
          # which would refuse a second domain, so both are named explicitly.
          # The default reproduces the library's own (anything under the
          # reverse proxy, plus relative URIs); prod overrides it to add the
          # second domain.
          post-login-allowed-uri-patterns: ${BFF_POST_LOGIN_PATTERNS:^${reverse-proxy-uri}(/.*)?$,^/.*$}
          post-logout-allowed-uri-patterns: ${BFF_POST_LOGOUT_PATTERNS:^${reverse-proxy-uri}(/.*)?$,^/.*$}
          csrf: cookie-accessible-from-js
          oauth2-redirections:
            rp-initiated-logout: ACCEPTED
        resourceserver:
          permit-all:
            - /login-options
            - /error
            - /actuator/health/readiness
            - /actuator/health/liveness

# Actuator #########################################################################################
management:
  endpoint:
    health:
      probes:
        enabled: true

