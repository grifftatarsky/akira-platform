databaseChangeLog:
  # Master changelog. Changesets live in db/changelog/changes/ and are included
  # in deterministic order. Each file has stable ids and must NEVER be modified
  # after being applied to a shared environment — new schema goes in new files.
  - include:
      file: db/changelog/changes/001-abuse-reports.yaml
      relativeToChangelogFile: false
  - include:
      file: db/changelog/changes/002-categories-and-messages.yaml
      relativeToChangelogFile: false
  - include:
      file: db/changelog/changes/003-desk.yaml
      relativeToChangelogFile: false
  - include:
      file: db/changelog/changes/004-blog.yaml
      relativeToChangelogFile: false
