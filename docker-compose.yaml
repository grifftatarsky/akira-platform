# THIS IS A COMPOSE PROJECT FOR THE LOCAL MACHINE ONLY!
# DO NOT USE THIS AS A PRODUCTION COMPOSE PROJECT!
# (However, you can use it as a base for what you'll need).

volumes:
  postgres_data:

networks:
  gpt-network:
    driver: bridge

services:
  postgres:
    container_name: pgsql
    image: postgres:18.6
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gpt-network

  # Nightly pg_dumpall into ./backups, three copies retained. Same image tag as
  # the server: pg_dumpall refuses to dump a cluster newer than itself, so these
  # two versions must be bumped together.
  pg-backup:
    container_name: pg-backup
    image: postgres:18.6
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGHOST: ${PG_HOST:-pgsql}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_DIR: /backups
      BACKUP_RETAIN: ${BACKUP_RETAIN:-3}
      TZ: ${BACKUP_TZ:-America/New_York}
    volumes:
      # Mount the directory, not the script: a single-file bind mount is pinned
      # to the inode on Linux, and `git pull` replaces files by rename, so the
      # container would silently keep running the pre-pull copy.
      - ${BACKUP_SCRIPT_DIR:-./backup}:/opt/backup:ro
      - ./backups:/backups
    entrypoint: [ "/opt/backup/pg-backup.sh", "loop" ]
    # The failure mode here is silence: the container sleeps 24h at a time, so a
    # broken backup looks identical to a working one. Assert the artefact
    # instead of the process — a non-empty dump from within the last 26h.
    healthcheck:
      test: [ "CMD-SHELL", "test -n \"$$(find /backups -name 'pgcluster-*.sql.gz' -mmin -1560 -size +1k)\"" ]
      interval: 1h
      timeout: 10s
      retries: 2
      start_period: 5m
    restart: unless-stopped
    networks:
      - gpt-network

  # Weekly note saying whether the nightly dumps actually happened. The failure
  # mode being guarded is silence: pg-backup sleeps 24h at a time, so a broken
  # backup and a working one look identical until somebody goes looking. This
  # mails what a dump cannot leak — names, sizes and checksums — and never the
  # dump, which carries every role password and every abuse report on the box.
  pg-backup-report:
    container_name: pg-backup-report
    image: python:3.13-alpine
    env_file:
      - .env
    environment:
      BACKUP_DIR: /backups
      BACKUP_STALE_HOURS: ${BACKUP_STALE_HOURS:-26}
      BACKUP_REPORT_WEEKDAY: ${BACKUP_REPORT_WEEKDAY:-0}
      BACKUP_REPORT_HOUR: ${BACKUP_REPORT_HOUR:-8}
      TZ: ${BACKUP_TZ:-America/New_York}
    volumes:
      - ${BACKUP_SCRIPT_DIR:-./backup}:/opt/backup:ro
      - ./backups:/backups:ro
    entrypoint: [ "python3", "/opt/backup/pg-backup-report.py", "loop" ]
    restart: unless-stopped
    networks:
      - gpt-network

  keycloak:
    container_name: keycloak
    image: keycloak/keycloak:26.7
    command:
      - start-dev
      - --import-realm
    ports:
      - "8080:8080"
      - "9000:9000"
    env_file:
      - .env
    volumes:
      - ./keycloak/:/opt/keycloak/data/import/
      # Themes live outside ./keycloak because that whole directory is mounted
      # as the realm import dir, and Keycloak scans it for realm JSON.
      - ./keycloak-themes/:/opt/keycloak/themes/
    environment:
      KC_DB: postgres
      KC_DB_URL: ${AUTH_DATASOURCE_JDBC_URL}
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: ${AUTH_DATASOURCE_USER}
      KC_DB_PASSWORD: ${AUTH_DATASOURCE_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:7080/auth
      KC_HOSTNAME_ADMIN: http://localhost:7080/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: false
      KC_HOSTNAME_DEBUG: true
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: [ 'CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)new java.net.URL(args[0]).openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:9000/auth/health/live' ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - gpt-network

  # Health check this?
  nginx:
    image: nginx:1.31.5
    container_name: nginx
    ports:
      - "7080:7080"
    volumes:
      # Mount the stable parent dist/ (shell + ooze remote), NOT the per-app
      # browser/ dirs: those are replaced on every `ng build`, which invalidates
      # a deeper bind mount and 403s the site until nginx is recreated. nginx
      # resolves paths per-request, so it always reads the current subdir here.
      - ./angular-client/akira-ng/dist:/usr/share/nginx/dist:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/certs:ro
      - ./logs:/var/log/nginx
    networks:
      - gpt-network