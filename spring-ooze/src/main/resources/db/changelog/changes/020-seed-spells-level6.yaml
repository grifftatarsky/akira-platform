databaseChangeLog:
  # ==========================================================================
  # 020 — SRD spell import, level 6. All 31 level-6 spells in SRD 5.2. Stats
  # are facts; descriptions are our own wording. Again SRD 5.2 naming, so
  # Freezing Sphere, Irresistible Dance, and Instant Summons drop the wizards.
  # ==========================================================================
  - changeSet:
      id: 020-seed-spells-level6
      author: oozengine
      changes:
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000001"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Blade Barrier"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "90 feet"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A wall of whirling force blades — 100 feet long, or a 60-foot ring, 20 feet high and 5 feet thick — provides Three-Quarters Cover and is Difficult Terrain. A creature in its space makes a Dexterity saving throw, taking 6d10 Force damage on a failure or half as much on a success, once per turn."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000002"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Chain Lightning"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "150 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "three silver pins"}}, {column: {name: description, value: "A bolt strikes one target, then three more leap to other targets within 30 feet of it, each of which can be hit only once. Every target makes a Dexterity saving throw, taking 10d8 Lightning damage on a failure or half as much on a success."}}, {column: {name: at_higher_levels, value: "One additional bolt leaps from the first target to another target for each spell slot level above 6."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000003"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Circle of Death"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "150 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "the powder of a crushed black pearl worth 500+ GP"}}, {column: {name: description, value: "Negative energy ripples out in a 60-foot-radius Sphere. Each creature in the area makes a Constitution saving throw, taking 8d8 Necrotic damage on a failure or half as much on a success."}}, {column: {name: at_higher_levels, value: "The damage increases by 2d8 for each spell slot level above 6."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000004"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Conjure Fey"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A Medium spirit from the Feywild appears and immediately lets you make one melee spell attack for 3d12 Psychic damage plus your spellcasting ability modifier, leaving the target Frightened of both you and the spirit until your next turn. A Bonus Action teleports the spirit 30 feet and repeats the attack."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d12 for each spell slot level above 6."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000005"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Contingency"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "10 minutes"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "10 days"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a gem-encrusted statuette of yourself worth 1,500+ GP"}}, {column: {name: description, value: "Cast a spell of level 5 or lower that can target you, expending both slots, and hang it on a trigger you describe. It takes effect the first time that trigger occurs — whether you want it to or not — affects only you, and ends Contingency. Only one Contingency can be on you at a time."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000006"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Create Undead"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "1 minute"}}, {column: {name: range, value: "10 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "one 150+ GP black onyx stone for each corpse"}}, {column: {name: description, value: "Cast at night, up to three Medium or Small Humanoid corpses within range rise as Ghouls under your control. A Bonus Action commands any of them within 120 feet; your control lapses after 24 hours unless you recast the spell on them before it does."}}, {column: {name: at_higher_levels, value: "If you use a level 7 spell slot, you can animate or reassert control over four Ghouls. If you use a level 8 spell slot, you can animate or reassert control over five Ghouls or two Ghasts or Wights. If you use a level 9 spell slot, you can animate or reassert control over six Ghouls, three Ghasts or Wights, or two Mummies."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000007"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Disintegrate"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a lodestone and dust"}}, {column: {name: description, value: "A green ray strikes a creature, a nonmagical object, or a creation of magical force such as a Wall of Force. A creature makes a Dexterity saving throw or takes 10d6 + 40 Force damage, and if that reduces it to 0 Hit Points, it and everything nonmagical it carries crumble to gray dust — recoverable only by True Resurrection or Wish."}}, {column: {name: at_higher_levels, value: "The damage increases by 3d6 for each spell slot level above 6."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000008"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Eyebite"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Your eyes become inky voids. Each turn you can target a creature within 60 feet that you can see; on a failed Wisdom saving throw it is Asleep and Unconscious, Panicked and forced to flee you, or Sickened and Poisoned — your choice. A creature that saves cannot be targeted again by this casting."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000009"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Find the Path"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "1 minute"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 1 day"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a set of divination tools—such as cards or runes—worth 100+ GP"}}, {column: {name: description, value: "Sense the most direct physical route to a location you are familiar with on your own plane. For the duration you know how far away it lies and in what direction, and at every fork you know which path is the shortest way there."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-00000000000a"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Flesh to Stone"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a cockatrice feather"}}, {column: {name: description, value: "A creature you can see makes a Constitution saving throw or is Restrained as its flesh begins to harden, saving again at the end of each of its turns. Three successes end the spell; three failures leave it Petrified — permanently, if you hold Concentration for the full duration."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-00000000000b"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Forbiddance"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "10 minutes or Ritual"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "1 day"}}, {column: {name: ritual, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "ruby dust worth 1,000+ GP"}}, {column: {name: description, value: "Ward up to 40,000 square feet of floor against teleportation, portals, and planar travel of every kind. Creature types you choose take 5d10 Radiant or Necrotic damage on entering the area or ending a turn there unless they speak a password you set. Cast it daily for 30 days and it lasts until dispelled."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-00000000000c"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Freezing Sphere"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "300 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a miniature crystal sphere"}}, {column: {name: description, value: "A frigid globe streaks to a point and explodes in a 60-foot-radius Sphere for 10d6 Cold damage on a failed Constitution saving throw, half as much on a success, freezing open water 6 inches deep. You can instead hold the globe back to throw or sling later; it bursts on impact, or by itself after a minute."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d6 for each spell slot level above 6."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-00000000000d"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Globe of Invulnerability"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a glass bead"}}, {column: {name: description, value: "A shimmering barrier fills a 10-foot Emanation around you. Spells of level 5 or lower cast from outside cannot affect anything within it — they may target creatures inside, but nothing happens — and areas of effect from such spells stop at the edge."}}, {column: {name: at_higher_levels, value: "The barrier blocks spells of 1 level higher for each spell slot level above 6."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-00000000000e"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Guards and Wards"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "1 hour"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "24 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a silver rod worth 10+ GP"}}, {column: {name: description, value: "An hour of work wards up to 2,500 square feet with four effects: fog and false turns in the corridors, Arcane Lock on every door with illusions hiding up to ten of them, Web on every stair, and one further effect of your choice such as Stinking Cloud, Magic Mouth, or a Suggestion on a single square. Each can be dispelled separately, and the ward ends when all four are gone."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-00000000000f"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Harm"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Virulent magic lashes a creature you can see. On a failed Constitution saving throw it takes 14d6 Necrotic damage and its Hit Point maximum drops by the same amount; a success halves the damage and spares the maximum. The spell can never push a maximum below 1."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000010"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Heal"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Positive energy washes through a creature you can see, restoring 70 Hit Points and ending the Blinded, Deafened, and Poisoned conditions on it."}}, {column: {name: at_higher_levels, value: "The healing increases by 10 for each spell slot level above 6."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000011"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Heroes' Feast"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "10 minutes"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a gem-encrusted bowl worth 1,000+ GP, consumed"}}, {column: {name: description, value: "A feast appears in a 10-foot Cube and takes an hour to eat. Up to twelve diners each gain Resistance to Poison damage, Immunity to the Frightened and Poisoned conditions, and 2d10 additional Hit Points and Hit Point maximum, all lasting 24 hours."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000012"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Instant Summons"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "1 minute or Ritual"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Until dispelled"}}, {column: {name: ritual, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a sapphire worth 1,000+ GP"}}, {column: {name: description, value: "Mark an object of 10 pounds or less and inscribe its name invisibly on the sapphire you cast with. Crushing that sapphire later calls the object into your hand across any physical or planar distance — or, if another creature is carrying it, tells you who they are and where they are instead."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000013"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Irresistible Dance"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "One creature you can see makes a Wisdom saving throw. On a success it dances comically until the end of its next turn; on a failure it is Charmed and dances in place, spending all its movement, with Disadvantage on Dexterity saves and attack rolls while everyone attacking it has Advantage. It can spend an action each turn to collect itself and save again."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000014"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Magic Jar"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "1 minute"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Until dispelled"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a gem, crystal, or reliquary worth 500+ GP"}}, {column: {name: description, value: "Your body falls catatonic as your soul enters the gem or reliquary you cast with. From there you can project up to 100 feet to possess a Humanoid that fails a Charisma saving throw, taking its Hit Points, physical scores, Speed, and senses while its own soul waits, Incapacitated, in the container."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000015"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Mass Suggestion"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "24 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a snake's tongue"}}, {column: {name: description, value: "Suggest a plausible course of action, in 25 words or fewer, to up to twelve creatures that can hear and understand you. Each makes a Wisdom saving throw or is Charmed and pursues it for 24 hours — or until the task is finished, or until you or your allies deal it damage."}}, {column: {name: at_higher_levels, value: "The duration is longer with a spell slot of level 7 (10 days), 8 (30 days), or 9 (366 days)."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000016"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Move Earth"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "Concentration, up to 2 hours"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a miniature shovel"}}, {column: {name: description, value: "Reshape dirt, sand, or clay across an area up to 40 feet on a side — raising or lowering elevation, digging trenches, erecting walls, forming pillars — by up to half the area's largest dimension. Changes take 10 minutes to finish, so nothing is trapped or crushed, and natural stone and stonework are untouched."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be21000-0000-4000-a000-000000000017"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Planar Ally"}}, {column: {name: level, valueNumeric: 6}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "10 minutes"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Beseech a god, demon prince, or other cosmic power known to you, and it sends a Celestial, an Elemental, or a Fiend to you. The creature arrives under no compulsion to help: you must be able to communicate and bargain with it, and the going rate starts at 100 GP per minute of work."}}]}
