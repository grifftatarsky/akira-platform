databaseChangeLog:
  # ==========================================================================
  # 021 — SRD spell import, level 7. All 20 level-7 spells in SRD 5.2. Stats
  # are facts; descriptions are our own wording.
  # ==========================================================================
  - changeSet:
      id: 021-seed-spells-level7
      author: oozengine
      changes:
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-000000000001"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Arcane Sword"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "90 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a miniature sword worth 250+ GP"}}, {column: {name: description, value: "A spectral blade hovers within range and makes a melee spell attack for 4d12 Force damage plus your spellcasting ability modifier. On later turns a Bonus Action moves it up to 30 feet and repeats the attack against the same target or a new one."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-000000000002"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Conjure Celestial"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "90 feet"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A spirit from the Upper Planes manifests as a pillar of light in a 10-foot-radius, 40-foot-high Cylinder. For each creature you can see inside, choose Healing Light for 4d12 Hit Points plus your spellcasting ability modifier, or Searing Light for 6d12 Radiant damage on a failed Dexterity saving throw, half as much on a success."}}, {column: {name: at_higher_levels, value: "The healing and damage increase by 1d12 for each spell slot level above 7."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-000000000003"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Delayed Blast Fireball"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "150 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a ball of bat guano and sulfur"}}, {column: {name: description, value: "A glowing bead waits at a point you choose, gathering 1d6 more damage at the end of every turn on top of its 12d6 base. When the spell ends the bead detonates in a 20-foot-radius Sphere; each creature there makes a Dexterity saving throw for the accumulated Fire damage, half as much on a success."}}, {column: {name: at_higher_levels, value: "The base damage increases by 1d6 for each spell slot level above 7."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-000000000004"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Divine Word"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Bonus Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "You speak a word charged with power from the Upper Planes. Creatures of your choice make a Charisma saving throw; those at 50 Hit Points or fewer that fail are Deafened, Blinded and Deafened, Stunned as well, or killed outright, depending on how badly hurt they already are. Regardless of Hit Points, a failing Celestial, Elemental, Fey, or Fiend is forced home for 24 hours."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-000000000005"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Etherealness"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Up to 8 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Step into the Border Ethereal, where it overlaps the plane you left. You can move in any direction, with vertical movement costing double, and see the plane behind you as gray blur out to 60 feet, able to affect and be affected only by things on the Ethereal Plane."}}, {column: {name: at_higher_levels, value: "You can target up to three willing creatures (including yourself) for each spell slot level above 7. The creatures must be within 10 feet of you when you cast the spell."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-000000000006"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Finger of Death"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Negative energy lances a creature you can see. It makes a Constitution saving throw, taking 7d8 + 30 Necrotic damage on a failure or half as much on a success. A Humanoid killed by the spell rises at the start of your next turn as a Zombie that follows your spoken orders."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-000000000007"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Fire Storm"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "150 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A storm of fire fills up to ten 10-foot Cubes that you arrange as you like, each touching at least one other. Each creature in the area makes a Dexterity saving throw, taking 7d10 Fire damage on a failure or half as much on a success, and unattended flammable objects start burning."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-000000000008"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Forcecage"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "100 feet"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "ruby dust worth 1,500+ GP, consumed"}}, {column: {name: description, value: "An Invisible prison of force springs into being: a barred cage up to 20 feet on a side, or a solid box up to 10 feet on a side that stops matter and spells alike. Anything fully inside is trapped, anything partly inside is pushed clear, and leaving by teleportation requires a successful Charisma saving throw. It extends into the Ethereal Plane and Dispel Magic cannot touch it."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-000000000009"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Magnificent Mansion"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "1 minute"}}, {column: {name: range, value: "300 feet"}}, {column: {name: duration, value: "24 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a miniature door worth 15+ GP"}}, {column: {name: description, value: "A shimmering door opens onto an extradimensional dwelling of up to fifty contiguous 10-foot Cubes, furnished as you like, warm and clean, stocked with a banquet for a hundred and staffed by a hundred near-transparent servants. Only you and those you name may enter, and everything and everyone left inside is expelled when the spell ends."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-00000000000a"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Mirage Arcane"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "10 minutes"}}, {column: {name: range, value: "Sight"}}, {column: {name: duration, value: "10 days"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Make up to a square mile of terrain look, sound, smell, and feel like different terrain, and alter or add structures within it. Because the illusion is tactile, it can turn open ground into Difficult Terrain or hide a chasm under a meadow. It neither conceals nor creates creatures, and Truesight reveals the true landscape while the illusion still physically responds."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-00000000000b"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Plane Shift"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a forked, metal rod worth 250+ GP and attuned to a plane of existence"}}, {column: {name: description, value: "You and up to eight willing creatures joining hands travel to a plane you name in general terms, arriving in or near it at the GM's discretion, or to a teleportation circle whose sigil sequence you know. Used on an unwilling creature it becomes a melee spell attack that banishes that creature alone on a failed Charisma saving throw."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-00000000000c"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Prismatic Spray"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Eight rays of light flash in a 60-foot Cone. Roll 1d8 for each target to see which colour strikes it: red, orange, yellow, green, or blue deal 12d6 damage of a matching type on a failed Dexterity saving throw; indigo Restrains and then Petrifies; violet Blinds and then banishes to another plane; and an 8 means two rays at once."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-00000000000d"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Project Image"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "500 miles"}}, {column: {name: duration, value: "Concentration, up to 1 day"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a statuette of yourself worth 5+ GP"}}, {column: {name: description, value: "An intangible copy of you appears at any place within 500 miles that you have seen before, however much lies between. You see and hear through it, and a Magic action moves it up to 60 feet and makes it gesture, speak, and behave as you choose. Any damage to the illusion ends the spell."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-00000000000e"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Regenerate"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "1 minute"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "1 hour"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a prayer wheel"}}, {column: {name: description, value: "A creature you touch regains 4d8 + 15 Hit Points and then 1 more at the start of each of its turns for the hour. Severed body parts regrow after 2 minutes."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-00000000000f"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Resurrection"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "1 hour"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a diamond worth 1,000+ GP, consumed"}}, {column: {name: description, value: "Revive a creature dead up to a century, that did not die of old age and was not Undead, with all its Hit Points, every wound closed, poisons neutralized, and missing body parts restored. The target takes a -4 penalty to D20 Tests that drops by 1 with each Long Rest."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-000000000010"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Reverse Gravity"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "100 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a lodestone and iron filings"}}, {column: {name: description, value: "Gravity inverts in a 50-foot-radius, 100-foot-high Cylinder. Everything unanchored falls upward to the top, with a Dexterity saving throw to grab a fixed object instead, and anything striking a ceiling on the way takes falling damage as normal. When the spell ends, whatever is aloft falls back down."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-000000000011"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Sequester"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Until dispelled"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "gem dust worth 5,000+ GP, consumed"}}, {column: {name: description, value: "An object or a willing creature you touch becomes Invisible and cannot be targeted by Divination spells, detected by magic, or viewed remotely. A creature also enters suspended animation: Unconscious, ageless, and needing no food, water, or air until the trigger you set occurs or the spell is dispelled."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-000000000012"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Simulacrum"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "12 hours"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Until dispelled"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "powdered ruby worth 1,500+ GP, consumed"}}, {column: {name: description, value: "Twelve hours and a creature-sized pile of snow produce a duplicate of a Beast or Humanoid that stayed within 10 feet throughout. It is a Construct with the original's statistics, half its Hit Point maximum, and no ability to cast this spell; it obeys you, cannot gain levels or rest, and is repaired only during your Long Rest at 100 GP of components per Hit Point."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-000000000013"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Symbol"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "1 minute"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Until dispelled or triggered"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "powdered diamond worth 1,000+ GP, consumed"}}, {column: {name: description, value: "Inscribe a nearly imperceptible glyph on a surface or inside a container that can be closed, setting both its trigger and its effect: Death, Discord, Fear, Pain, Sleep, or Stunning. When triggered, the glyph fills a 60-foot-radius Sphere with Dim Light for 10 minutes and afflicts everyone caught inside it."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be22000-0000-4000-a000-000000000014"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Teleport"}}, {column: {name: level, valueNumeric: 7}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "10 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "Move yourself and up to eight willing creatures, or a single Large or smaller object, to a destination you know on your own plane. Familiarity decides the odds on a 1d100 roll: a permanent circle or a linked object never fails, while a place merely described risks landing off target, in a similar area, or a mishap costing 3d10 Force damage and another roll."}}]}
