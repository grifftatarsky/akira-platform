databaseChangeLog:
  # ==========================================================================
  # 023 — SRD spell import, level 9. All 16 level-9 spells in SRD 5.2. This
  # completes the spell list: every spell in SRD 5.2 is now seeded across
  # 006 and 014-023. Stats are facts; descriptions are our own wording.
  # ==========================================================================
  - changeSet:
      id: 023-seed-spells-level9
      author: oozengine
      changes:
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be24000-0000-4000-a000-000000000001"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Astral Projection"}}, {column: {name: level, valueNumeric: 9}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "1 hour"}}, {column: {name: range, value: "10 feet"}}, {column: {name: duration, value: "Until dispelled"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "for each of the spell's targets, one jacinth worth 1,000+ GP and one silver bar worth 100+ GP, all consumed"}}, {column: {name: description, value: "You and up to eight willing creatures project into the Astral Plane, leaving your bodies behind in suspended animation — Unconscious, ageless, and needing neither food nor air. Each astral form trails a silvery cord back to its body; severing the cord kills the traveller outright."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be24000-0000-4000-a000-000000000002"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Foresight"}}, {column: {name: level, valueNumeric: 9}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "1 minute"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "8 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a hummingbird feather"}}, {column: {name: description, value: "For 8 hours a willing creature you touch sees a little way into its own future: it has Advantage on every D20 Test, and every attack roll against it has Disadvantage. Casting the spell again ends the earlier casting."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be24000-0000-4000-a000-000000000003"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Gate"}}, {column: {name: level, valueNumeric: 9}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a diamond worth 5,000+ GP"}}, {column: {name: description, value: "A circular portal 5 to 20 feet across links an unoccupied space you can see to a precise location on another plane, passable only from the front. Naming a specific creature as you cast opens the portal beside it and pulls it through to you — with no power over it once it arrives."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be24000-0000-4000-a000-000000000004"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Imprisonment"}}, {column: {name: level, valueNumeric: 9}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "1 minute"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Until dispelled"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a statuette of the target worth 5,000+ GP"}}, {column: {name: description, value: "A creature you can see makes a Wisdom saving throw or is bound in one of five ways: Burial, Chaining, Hedged Prison, Minimus Containment, or Slumber. While imprisoned it needs no air, food, or drink, does not age, cannot teleport, and cannot be found by Divination. You must name a trigger that will release it when you cast."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be24000-0000-4000-a000-000000000005"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Mass Heal"}}, {column: {name: level, valueNumeric: 9}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Up to 700 Hit Points of healing flood out from you, divided as you choose among any number of creatures you can see. Every creature healed also has the Blinded, Deafened, and Poisoned conditions removed."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be24000-0000-4000-a000-000000000006"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Meteor Swarm"}}, {column: {name: level, valueNumeric: 9}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "1 mile"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Four blazing orbs plummet onto points you can see up to a mile away, each filling a 40-foot-radius Sphere. Creatures there make a Dexterity saving throw, taking 20d6 Fire damage and 20d6 Bludgeoning damage on a failure or half as much on a success — and only once, however many Spheres overlap."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be24000-0000-4000-a000-000000000007"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Power Word Heal"}}, {column: {name: level, valueNumeric: 9}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "A wave of healing energy washes over one creature you can see. It regains all its Hit Points, and the Charmed, Frightened, Paralyzed, Poisoned, and Stunned conditions end on it. If it is Prone, it can use its Reaction to stand up."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be24000-0000-4000-a000-000000000008"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Power Word Kill"}}, {column: {name: level, valueNumeric: 9}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "You compel one creature you can see to die. If it has 100 Hit Points or fewer, it simply dies; otherwise it takes 12d12 Psychic damage."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be24000-0000-4000-a000-000000000009"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Prismatic Wall"}}, {column: {name: level, valueNumeric: 9}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "10 minutes"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Seven coloured layers form an opaque wall up to 90 feet long, or a globe up to 30 feet across. Coming within 20 feet risks Blindness, and anything passing through faces every layer in turn — fire, acid, lightning, poison, and cold for 12d6 each, then petrification, then banishment to another plane. The layers must be destroyed in order, and only the violet one answers to Dispel Magic."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be24000-0000-4000-a000-00000000000a"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Shapechange"}}, {column: {name: level, valueNumeric: 9}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a jade circlet worth 1,500+ GP"}}, {column: {name: description, value: "Shape-shift into any creature you have seen with a Challenge Rating no higher than your level, changing form again with a Magic action as often as you like. You keep your creature type, alignment, personality, mental scores, Hit Points, proficiencies, speech, and Spellcasting, and gain Temporary Hit Points equal to the first form's Hit Points."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be24000-0000-4000-a000-00000000000b"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Storm of Vengeance"}}, {column: {name: level, valueNumeric: 9}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "1 mile"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A storm cloud 300 feet across gathers up to a mile away, dealing 2d6 Thunder damage and Deafening everyone beneath it. It escalates each round: acidic rain for 4d6, then six lightning bolts of 10d6, then hailstones, then freezing gusts. Throughout, the area is Heavily Obscured, Difficult Terrain, and impossible to shoot through."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be24000-0000-4000-a000-00000000000c"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Time Stop"}}, {column: {name: level, valueNumeric: 9}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "Time halts for everyone but you while you take 1d4 + 1 turns in a row. The spell ends the instant one of your actions or effects touches another creature or something it is wearing or carrying, or if you travel more than 1,000 feet from where you cast it."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be24000-0000-4000-a000-00000000000d"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "True Polymorph"}}, {column: {name: level, valueNumeric: 9}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a drop of mercury, a dollop of gum arabic, and a wisp of smoke"}}, {column: {name: description, value: "Turn a creature into another creature or a nonmagical object, or an unattended object into a creature; an unwilling target gets a Wisdom saving throw. The change lasts the hour, or until the target dies or is destroyed — but hold Concentration for the full duration and it lasts until dispelled."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be24000-0000-4000-a000-00000000000e"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "True Resurrection"}}, {column: {name: level, valueNumeric: 9}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "1 hour"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "diamonds worth 25,000+ GP, consumed"}}, {column: {name: description, value: "Revive a creature dead up to 200 years for any reason but old age, restored to all its Hit Points with every wound closed, poison neutralized, contagion cured, and curse lifted, and its organs and limbs replaced. It can supply a new body if the original is gone, and returns an Undead creature to what it was in life."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be24000-0000-4000-a000-00000000000f"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Weird"}}, {column: {name: level, valueNumeric: 9}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Illusory terrors bloom in the minds of creatures of your choice in a 30-foot-radius Sphere. Each makes a Wisdom saving throw, taking 10d10 Psychic damage and the Frightened condition on a failure or half damage on a success. A Frightened target takes 5d10 more at the end of each of its turns until it shakes the fear off."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be24000-0000-4000-a000-000000000010"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Wish"}}, {column: {name: level, valueNumeric: 9}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "The mightiest spell a mortal can cast. Its basic use duplicates any spell of level 8 or lower with no requirements or costly components met. Otherwise choose one greater effect: a 25,000 GP object, full healing for twenty creatures, permanent Resistance for ten, immunity to one spell for eight hours, a swapped feat, or a rerolled die from the last round. Anything past that list is the GM's to rule, and the greater the wish, the likelier something goes wrong."}}]}
