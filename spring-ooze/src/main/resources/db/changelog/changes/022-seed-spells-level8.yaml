databaseChangeLog:
  # ==========================================================================
  # 022 — SRD spell import, level 8. All 17 level-8 spells in SRD 5.2, which
  # is where Feeblemind now lives as Befuddlement. Stats are facts;
  # descriptions are our own wording.
  # ==========================================================================
  - changeSet:
      id: 022-seed-spells-level8
      author: oozengine
      changes:
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-000000000001"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Animal Shapes"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "24 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Any number of willing creatures you can see shape-shift into Large or smaller Beasts of Challenge Rating 4 or lower, a different form each if you like, for 24 hours. They keep their Hit Points, mental scores, alignment, and speech, gain Temporary Hit Points equal to the Beast's Hit Points, and can neither cast spells nor use their melded equipment."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-000000000002"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Antimagic Field"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "iron filings"}}, {column: {name: description, value: "A 10-foot Emanation of antimagic surrounds you. Inside it nobody can cast spells, take Magic actions, teleport, travel between planes, or use a magic item's magical properties; areas of effect stop at its edge, portals close, and ongoing spells are suppressed while they remain within."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-000000000003"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Antipathy/Sympathy"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "1 hour"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "10 days"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a mix of vinegar and honey"}}, {column: {name: description, value: "Choose antipathy or sympathy, a Huge or smaller target, and a kind of creature. Creatures of that kind make a Wisdom saving throw within 120 feet of the target: antipathy leaves them Frightened and fleeing by the safest route, sympathy leaves them Charmed and drawn as close as they can get. Ending a turn more than 120 feet away earns another save."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-000000000004"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Befuddlement"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "150 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a key ring with no keys"}}, {column: {name: description, value: "You blast the mind of a creature you can see. On a failed Intelligence saving throw it takes 10d12 Psychic damage and can neither cast spells nor take the Magic action, repeating the save every 30 days; a success halves the damage and nothing more. Greater Restoration, Heal, or Wish ends it early."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-000000000005"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Clone"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "1 hour"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a diamond worth 1,000+ GP, consumed, and a sealable vessel worth 2,000+ GP that is large enough to hold the creature being cloned"}}, {column: {name: description, value: "An hour, a diamond, and at least a cubic inch of a creature's flesh start an inert duplicate growing in a sealed vessel; it finishes after 120 days and endures indefinitely while undisturbed. If the original dies afterwards, its soul transfers to the clone provided the soul is free and willing to return."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-000000000006"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Control Weather"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "10 minutes"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 8 hours"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "burning incense"}}, {column: {name: description, value: "Outdoors, you take command of the weather within 5 miles. Precipitation, temperature, and wind each sit on a scale you can shift one stage at a time, up or down, with each change taking 1d4 x 10 minutes to set in. The weather drifts back to normal when the spell ends, and going indoors ends it early."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-000000000007"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Demiplane"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "1 hour"}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A shadowy door appears on a flat solid surface and opens onto an empty 30-foot room of wood or stone. When the spell ends the door vanishes; anything left inside stays there unless it chooses to be shunted out Prone. Later castings can reopen the same demiplane, or one whose nature and contents you know."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-000000000008"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Dominate Monster"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Any creature you can see makes a Wisdom saving throw — with Advantage if you or your allies are fighting it — or is Charmed for the duration. A telepathic link lets you issue commands with no action required, and the target repeats the save every time it takes damage."}}, {column: {name: at_higher_levels, value: "Your Concentration can last longer with a level 9 spell slot (up to 8 hours)."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-000000000009"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Earthquake"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "500 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a fractured rock"}}, {column: {name: description, value: "An intense tremor rips through a 100-foot-radius circle of ground, making it Difficult Terrain and knocking creatures Prone and out of Concentration on a failed Dexterity saving throw each turn. It also opens 1d6 fissures 10 feet wide to swallow the unlucky, and deals 50 Bludgeoning damage per turn to any structure touching the ground."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-00000000000a"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Glibness"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "1 hour"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "For an hour you can replace the number rolled on any Charisma check with a 15, and no magic that would determine whether you are telling the truth registers anything you say as a lie."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-00000000000b"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Holy Aura"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a reliquary worth 1,000+ GP"}}, {column: {name: description, value: "A 30-foot Emanation of light surrounds you. Creatures of your choice inside it have Advantage on all saving throws, and attack rolls against them have Disadvantage. When a Fiend or an Undead hits one of them with a melee attack, it must succeed on a Constitution saving throw or be Blinded until the end of its next turn."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-00000000000c"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Incendiary Cloud"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "150 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Embers and smoke fill a 20-foot-radius Sphere that Heavily Obscures its area and drifts 10 feet each turn in a direction you choose. A creature in it makes a Dexterity saving throw, taking 10d8 Fire damage on a failure or half as much on a success, once per turn."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-00000000000d"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Maze"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Banish a creature you can see into a labyrinthine demiplane. It can take the Study action to attempt a DC 20 Intelligence (Investigation) check to find its way out, which ends the spell; otherwise it reappears in the space it left when the spell ends."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-00000000000e"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Mind Blank"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "24 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "For 24 hours a willing creature you touch has Immunity to Psychic damage and to the Charmed condition. Nothing can sense its emotions or alignment, read its thoughts, or magically detect where it is — and no spell, not even Wish, can gather information about it, watch it remotely, or control its mind."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-00000000000f"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Power Word Stun"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "You overwhelm the mind of a creature you can see. With 150 Hit Points or fewer it is Stunned; anything tougher merely has its Speed reduced to 0 until your next turn. The Stunned target makes a Constitution saving throw at the end of each of its turns to shake the condition off."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-000000000010"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Sunburst"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "150 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a piece of sunstone"}}, {column: {name: description, value: "Brilliant sunlight flashes in a 60-foot-radius Sphere. Each creature in it makes a Constitution saving throw, taking 12d6 Radiant damage and the Blinded condition for a minute on a failure or half damage on a success, with another save each turn to recover sight. The burst also dispels magical Darkness created by lower-level spells."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be23000-0000-4000-a000-000000000011"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Tsunami"}}, {column: {name: level, valueNumeric: 8}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "1 minute"}}, {column: {name: range, value: "1 mile"}}, {column: {name: duration, value: "Concentration, up to 6 rounds"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A wall of water up to 300 feet long, 300 feet high, and 50 feet thick rises up to a mile away, dealing 6d10 Bludgeoning damage on a failed Strength saving throw. Each turn it advances 50 feet away from you, sweeping Huge or smaller creatures along, then loses 50 feet of height and 1d10 of damage until it is spent."}}]}
