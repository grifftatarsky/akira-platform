databaseChangeLog:
  # ==========================================================================
  # 024 — the rest of levels 0-4. 014-018 walked the SRD 5.2 spell list but
  # skipped the spells whose 2024 text they could not confirm, leaving them
  # "for a verified pass". This is that pass, taken against the SRD 5.2 PDF
  # itself, so levels 0-4 now match the document exactly. One changeset per
  # level, appended to what 006 and 014-018 already seeded. Stats are facts;
  # descriptions are our own wording.
  # ==========================================================================
  - changeSet:
      id: 024-seed-spells-backfill-level0
      author: oozengine
      changes:
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be25000-0000-4000-a000-000000000001"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Acid Splash"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "An acidic bubble bursts in a 5-foot-radius Sphere at a point you choose. Each creature caught in it must succeed on a Dexterity saving throw or take 1d6 Acid damage."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d6 when you reach levels 5 (2d6), 11 (3d6), and 17 (4d6)."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be25000-0000-4000-a000-000000000002"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Chill Touch"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Channel the chill of the grave into a melee spell attack. On a hit the target takes 1d10 Necrotic damage and cannot regain Hit Points until the end of your next turn."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d10 when you reach levels 5 (2d10), 11 (3d10), and 17 (4d10)."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be25000-0000-4000-a000-000000000003"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Elementalism"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A small working of the elements within 30 feet: a breeze that stirs dust and closes shutters, a shroud of sand or a word written in the dirt, harmless embers and scented smoke, or a spray of mist and a cup of clean water. You can also sculpt a 1-foot Cube of any of those into a crude shape for an hour."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be25000-0000-4000-a000-000000000004"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Poison Spray"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Spray toxic mist at a creature within range as a ranged spell attack. On a hit the target takes 1d12 Poison damage."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d12 when you reach levels 5 (2d12), 11 (3d12), and 17 (4d12)."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be25000-0000-4000-a000-000000000005"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Sorcerous Burst"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Hurl raw sorcerous energy as a ranged spell attack. On a hit the target takes 1d8 damage of a type you choose from Acid, Cold, Fire, Lightning, Poison, Psychic, or Thunder. Every 8 you roll lets you roll another d8 and add it, up to your spellcasting ability modifier in extra dice."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8)."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be25000-0000-4000-a000-000000000006"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Starry Wisp"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Launch a mote of light as a ranged spell attack. On a hit the target takes 1d8 Radiant damage and, until the end of your next turn, sheds Dim Light in a 10-foot radius and gains no benefit from the Invisible condition."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8)."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be25000-0000-4000-a000-000000000007"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "True Strike"}}, {column: {name: level, valueNumeric: 0}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a weapon with which you have proficiency and that is worth 1+ CP"}}, {column: {name: description, value: "A flash of insight guides one attack with the weapon you cast through, using your spellcasting ability for the attack and damage rolls instead of Strength or Dexterity. The damage can be Radiant or the weapon's own type, your choice."}}, {column: {name: at_higher_levels, value: "Whether you deal Radiant damage or the weapon's normal damage type, the attack deals extra Radiant damage when you reach levels 5 (1d6), 11 (2d6), and 17 (3d6)."}}]}
  - changeSet:
      id: 024-seed-spells-backfill-level1
      author: oozengine
      changes:
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be26000-0000-4000-a000-000000000001"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Chromatic Orb"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "90 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a diamond worth 50+ GP"}}, {column: {name: description, value: "Hurl an orb of Acid, Cold, Fire, Lightning, Poison, or Thunder as a ranged spell attack for 3d8 damage of that type. Roll the same number on two or more of the d8s and the orb leaps to another target within 30 feet for a fresh attack and damage roll — once only, unless you cast it with a level 2+ slot."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d8 for each spell slot level above 1. The orb can leap a maximum number of times equal to the level of the slot expended, and a creature can be targeted only once by each casting."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be26000-0000-4000-a000-000000000002"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Color Spray"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a pinch of colorful sand"}}, {column: {name: description, value: "A dazzling array of light flashes in a 15-foot Cone. Each creature in it must succeed on a Constitution saving throw or have the Blinded condition until the end of your next turn."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be26000-0000-4000-a000-000000000003"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Create or Destroy Water"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a mix of water and sand"}}, {column: {name: description, value: "Create up to 10 gallons of clean water in an open container, or as rain in a 30-foot Cube that snuffs exposed flames — or destroy the same amount of water in a container, or fog filling that Cube."}}, {column: {name: at_higher_levels, value: "You create or destroy 10 additional gallons of water, or the size of the Cube increases by 5 feet, for each spell slot level above 1."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be26000-0000-4000-a000-000000000004"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Detect Poison and Disease"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "Action or Ritual"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: ritual, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a yew leaf"}}, {column: {name: description, value: "Sense the location and kind of every poison, venomous or poisonous creature, and magical contagion within 30 feet. A foot of stone, dirt, or wood, an inch of metal, or a thin sheet of lead blocks it."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be26000-0000-4000-a000-000000000005"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Dissonant Whispers"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "A discordant melody sounds in one mind. The target makes a Wisdom saving throw, taking 3d6 Psychic damage on a failure or half as much on a success; a failure also forces it to spend its Reaction, if it has one, fleeing as far from you as it safely can."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d6 for each spell slot level above 1."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be26000-0000-4000-a000-000000000006"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Divine Favor"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Bonus Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "1 minute"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "For a minute, your weapon attacks deal an extra 1d4 Radiant damage on a hit."}}]}
