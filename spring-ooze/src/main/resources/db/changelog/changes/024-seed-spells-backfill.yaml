        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be26000-0000-4000-a000-00000000000c"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Hellish Rebuke"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Reaction, which you take in response to taking damage from a creature that you can see within 60 feet of yourself"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Green flames engulf the creature that just damaged you. It makes a Dexterity saving throw, taking 2d10 Fire damage on a failure or half as much on a success."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d10 for each spell slot level above 1."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be26000-0000-4000-a000-00000000000d"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Hex"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Bonus Action"}}, {column: {name: range, value: "90 feet"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "the petrified eye of a newt"}}, {column: {name: description, value: "Curse a creature you can see. Your attack rolls against it deal an extra 1d6 Necrotic damage, and it has Disadvantage on ability checks made with one ability you choose. If it drops to 0 Hit Points, a later Bonus Action moves the curse to someone new."}}, {column: {name: at_higher_levels, value: "Your Concentration can last longer with a spell slot of level 2 (up to 4 hours), 3-4 (up to 8 hours), or 5+ (24 hours)."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be26000-0000-4000-a000-00000000000e"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Hideous Laughter"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a tart and a feather"}}, {column: {name: description, value: "A creature you can see makes a Wisdom saving throw or falls Prone and Incapacitated, laughing helplessly and unable to stand. It saves again at the end of each of its turns and each time it takes damage, with Advantage when damage triggers the save."}}, {column: {name: at_higher_levels, value: "You can target one additional creature for each spell slot level above 1."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be26000-0000-4000-a000-00000000000f"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Hunter's Mark"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "Bonus Action"}}, {column: {name: range, value: "90 feet"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "Mark a creature you can see as your quarry. Your attack rolls against it deal an extra 1d6 Force damage, and you have Advantage on Wisdom (Perception or Survival) checks to find it. If it drops to 0 Hit Points, a Bonus Action moves the mark to a new target."}}, {column: {name: at_higher_levels, value: "Your Concentration can last longer with a spell slot of level 3-4 (up to 8 hours) or 5+ (up to 24 hours)."}}]}
