        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be26000-0000-4000-a000-000000000008"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Ensnaring Strike"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Bonus Action, which you take immediately after hitting a creature with a weapon"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "Grasping vines erupt on the creature you just hit. It makes a Strength saving throw — with Advantage if it is Large or larger — or is Restrained, taking 1d6 Piercing damage at the start of each of its turns. It or an ally within reach can spend an action on a Strength (Athletics) check against your spell save DC to break free."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d6 for each spell slot level above 1."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be26000-0000-4000-a000-000000000009"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "False Life"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a drop of alcohol"}}, {column: {name: description, value: "A necromantic ward wraps you in 2d4 + 4 Temporary Hit Points."}}, {column: {name: at_higher_levels, value: "You gain 5 additional Temporary Hit Points for each spell slot level above 1."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be26000-0000-4000-a000-00000000000a"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Floating Disk"}}, {column: {name: level, valueNumeric: 1}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action or Ritual"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "1 hour"}}, {column: {name: ritual, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a drop of mercury"}}, {column: {name: description, value: "A 3-foot disk of force hovers 3 feet off the ground and carries up to 500 pounds. It stays put while you are within 20 feet and otherwise trails after you, handling slopes and stairs but never an elevation change of 10 feet or more."}}]}
