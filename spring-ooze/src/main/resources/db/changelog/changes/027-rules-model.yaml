  - changeSet:
      id: 027-component-targets
      author: oozengine
      # "makes one Rend attack", "casts Wall of Ice" and "takes the Disengage
      # action" are the same sentence with a different object, so they become one
      # mechanism. references_feature_id loses its NOT NULL to make room.
      changes:
        - addColumn:
            tableName: feature_components
            columns:
              - column: {name: references_spell_id, type: UUID}
              - column: {name: spell_level, type: INT}
              - column: {name: references_action_id, type: UUID}
        - dropNotNullConstraint:
            tableName: feature_components
            columnName: references_feature_id
            columnDataType: UUID
        - addForeignKeyConstraint:
            constraintName: fk_components_spell
            baseTableName: feature_components
            baseColumnNames: references_spell_id
            referencedTableName: spells
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            constraintName: fk_components_action
            baseTableName: feature_components
            baseColumnNames: references_action_id
            referencedTableName: glossary_entries
            referencedColumnNames: id
            onDelete: CASCADE
        - sql:
            comment: Exactly one target, so a component always resolves to something.
            sql: >-
              ALTER TABLE feature_components ADD CONSTRAINT ck_components_single_target
              CHECK (num_nonnulls(references_feature_id, references_spell_id,
              references_action_id) = 1)

