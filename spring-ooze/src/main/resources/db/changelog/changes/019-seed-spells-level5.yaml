databaseChangeLog:
  # ==========================================================================
  # 019 — SRD spell import, level 5. All 38 level-5 spells in SRD 5.2; none
  # were seeded earlier, so there is nothing to exclude. Stats are facts;
  # descriptions are our own wording. SRD 5.2 names are used as published, so
  # the wizard-named spells appear here as Arcane Hand and Telepathic Bond.
  # ==========================================================================
  - changeSet:
      id: 019-seed-spells-level5
      author: oozengine
      changes:
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000001"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Animate Objects"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Up to your spellcasting ability modifier in unattended nonmagical objects sprout legs and animate as Constructs using the Animated Object stat block; a Large object counts as two of that total and a Huge one as three. They share your Initiative, act immediately after you, and one Bonus Action commands any of them within 500 feet."}}, {column: {name: at_higher_levels, value: "The creature's Slam damage increases by 1d4 (Medium or smaller), 1d6 (Large), or 1d12 (Huge) for each spell slot level above 5."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000002"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Antilife Shell"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A 10-foot Emanation travels with you that nothing but Constructs and Undead can pass or reach through. Blocked creatures can still cast spells and attack across it, and the spell ends the moment your own movement would force one through."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000003"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Arcane Hand"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "an eggshell and a glove"}}, {column: {name: description, value: "A Large hand of force appears within range and mirrors your own, with AC 20 and Hit Points equal to your maximum. A Bonus Action moves it 60 feet and triggers one effect: a Clenched Fist for 5d8 Force damage, a Forceful Hand shove, a Grasping Hand grapple that can crush for 4d6 plus your spellcasting ability modifier, or an Interposing Hand granting you Half Cover."}}, {column: {name: at_higher_levels, value: "The damage of the Clenched Fist increases by 2d8 and the damage of the Grasping Hand increases by 2d6 for each spell slot level above 5."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000004"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Awaken"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "8 hours"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "an agate worth 1,000+ GP, consumed"}}, {column: {name: description, value: "Eight hours of tracing pathways through a gemstone give a Beast, a Plant creature of Intelligence 3 or less, or an ordinary plant an Intelligence of 10, a language you know, and — for a plant — limbs and senses. The awakened creature is Charmed by you for 30 days, then chooses its own attitude toward you."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000005"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Cloudkill"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A 20-foot-radius Sphere of yellow-green fog Heavily Obscures its area and drifts 10 feet away from you at the start of each of your turns. A creature in it makes a Constitution saving throw, taking 5d8 Poison damage on a failure or half as much on a success, once per turn."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d8 for each spell slot level above 5."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000006"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Commune"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "1 minute or Ritual"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "1 minute"}}, {column: {name: ritual, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "incense"}}, {column: {name: description, value: "Put up to three yes-or-no questions to a deity or its proxy and receive true answers, though anything beyond the deity's knowledge may come back as unclear. Each casting after the first before a Long Rest adds a cumulative 25 percent chance of no answer at all."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000007"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Commune with Nature"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "1 minute or Ritual"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: ritual, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Nature spirits tell you three facts of your choice about the land within 3 miles — 300 feet in caves and other natural underground settings — such as terrain, bodies of water, settlements, planar portals, and powerful creatures. It does not work where construction has replaced nature."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000008"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Cone of Cold"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a small crystal or glass cone"}}, {column: {name: description, value: "A blast of freezing air fills a 60-foot Cone. Each creature in it makes a Constitution saving throw, taking 8d8 Cold damage on a failure or half as much on a success; anything killed becomes a frozen statue until it thaws."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d8 for each spell slot level above 5."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000009"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Conjure Elemental"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A Large elemental spirit appears within range; its element — air, earth, fire, or water — sets its damage type. When a creature enters its space or starts a turn within 5 feet, you can force a Dexterity saving throw for 8d8 damage and the Restrained condition, with 4d8 more at the start of each turn it stays caught."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d8 for each spell slot level above 5."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-00000000000a"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Contact Other Plane"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "1 minute or Ritual"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "1 minute"}}, {column: {name: ritual, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "Reach out to a demigod, a long-dead sage, or another otherworldly intelligence and make a DC 15 Intelligence saving throw. Success buys up to five one-word answers; failure costs 6d6 Psychic damage and leaves you Incapacitated until a Long Rest or a Greater Restoration."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-00000000000b"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Contagion"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "7 days"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Your touch inflicts a magical contagion. On a failed Constitution saving throw the target takes 11d8 Necrotic damage, is Poisoned, and has Disadvantage on saves made with one ability you choose. It saves again at the end of each of its turns until it collects three successes, which end the spell, or three failures, which lock the disease in for the full 7 days."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-00000000000c"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Creation"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "1 minute"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Special"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a paintbrush"}}, {column: {name: description, value: "Pull wisps of shadow from the Shadowfell into an object no larger than a 5-foot Cube, of a form and material you have seen. How long it lasts depends on what it is made of, from 24 hours for vegetable matter down to 1 minute for adamantine or mithral."}}, {column: {name: at_higher_levels, value: "The Cube increases by 5 feet for each spell slot level above 5."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-00000000000d"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Dispel Evil and Good"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "powdered silver and iron"}}, {column: {name: description, value: "Celestials, Elementals, Fey, Fiends, and Undead have Disadvantage on attack rolls against you. You can spend the spell early on one of two functions: Break Enchantment frees a creature you touch from being possessed, Charmed, or Frightened by such a creature, and Dismissal sends one within 5 feet back to its home plane on a failed Charisma saving throw."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-00000000000e"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Dominate Person"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A Humanoid you can see makes a Wisdom saving throw — with Advantage if you or your allies are fighting it — or is Charmed for the duration. A telepathic link lets you issue commands with no action required, and the target repeats the save every time it takes damage."}}, {column: {name: at_higher_levels, value: "Your Concentration can last longer with a spell slot of level 6 (up to 10 minutes), 7 (up to 1 hour), or 8+ (up to 8 hours)."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-00000000000f"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Dream"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "1 minute"}}, {column: {name: range, value: "Special"}}, {column: {name: duration, value: "8 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a handful of sand"}}, {column: {name: description, value: "You or a willing messenger falls into a trance and walks into the dreams of a creature you know on your plane, free to converse and to shape the dream itself. Made terrifying, the messenger can deliver ten words and force a Wisdom saving throw: on a failure the target gains no benefit from the rest and takes 3d6 Psychic damage on waking."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000010"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Flame Strike"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a pinch of sulfur"}}, {column: {name: description, value: "A column of brilliant fire roars down in a 10-foot-radius, 40-foot-high Cylinder. Each creature in it makes a Dexterity saving throw, taking 5d6 Fire damage and 5d6 Radiant damage on a failure or half as much on a success."}}, {column: {name: at_higher_levels, value: "The Fire damage and the Radiant damage increase by 1d6 for each spell slot level above 5."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000011"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Geas"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "1 minute"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "30 days"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: description, value: "Order a creature you can see to perform a service or refrain from some course of action. It makes a Wisdom saving throw or is Charmed for 30 days, taking 5d10 Psychic damage no more than once a day if it acts directly counter to the command. A suicidal order ends the spell, as do Remove Curse, Greater Restoration, and Wish."}}, {column: {name: at_higher_levels, value: "If you use a level 7 or 8 spell slot, the duration is 365 days. If you use a level 9 spell slot, the spell lasts until it is ended by one of the spells mentioned above."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000012"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Greater Restoration"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "diamond dust worth 100+ GP, consumed"}}, {column: {name: description, value: "Touch a creature and lift one lasting affliction from it: a level of Exhaustion, the Charmed or Petrified condition, a curse (including Attunement to a cursed magic item), a reduction to an ability score, or a reduction to its Hit Point maximum."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000013"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Hallow"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "24 hours"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Until dispelled"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "incense worth 1,000+ GP, consumed"}}, {column: {name: description, value: "A full day of work infuses a radius of up to 60 feet with holy or unholy power. Creature types you choose — Aberrations, Celestials, Elementals, Fey, Fiends, or Undead — cannot willingly enter, and their charms, fear, and possession have no hold inside. You also bind one extra effect to the area, such as Daylight, Darkness, Silence, Courage, Fear, or a Resistance."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000014"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Hold Monster"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "90 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a straight piece of iron"}}, {column: {name: description, value: "A creature you can see makes a Wisdom saving throw or has the Paralyzed condition for the duration, repeating the save at the end of each of its turns."}}, {column: {name: at_higher_levels, value: "You can target one additional creature for each spell slot level above 5."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000015"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Insect Plague"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "300 feet"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a locust"}}, {column: {name: description, value: "Swarming locusts fill a 20-foot-radius Sphere, making it Lightly Obscured and Difficult Terrain. A creature in the swarm makes a Constitution saving throw, taking 4d10 Piercing damage on a failure or half as much on a success, once per turn on entering the area or ending its turn there."}}, {column: {name: at_higher_levels, value: "The damage increases by 1d10 for each spell slot level above 5."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000016"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Legend Lore"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "10 minutes"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "incense worth 250+ GP, consumed, and four ivory strips worth 50+ GP each"}}, {column: {name: description, value: "Name or describe a famous person, place, or object and the spell brings a summary of the significant lore about it to mind — more precise the more you already knew, and possibly couched in poetry or figurative language. If the subject is not actually famous, you hear sad trombone notes and the spell fails."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000017"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Mass Cure Wounds"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A wave of healing washes out through a 30-foot-radius Sphere. Up to six creatures of your choice inside it each regain 5d8 Hit Points plus your spellcasting ability modifier."}}, {column: {name: at_higher_levels, value: "The healing increases by 1d8 for each spell slot level above 5."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000018"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Mislead"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "You turn Invisible while an illusory double of you appears where you stood. A Magic action moves the double up to twice your Speed and makes it gesture, speak, and behave as you like, and you can see and hear through it. The invisibility — not the double — ends as soon as you attack, deal damage, or cast a spell."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000019"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Modify Memory"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "ENCHANTMENT"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "A creature you can see makes a Wisdom saving throw or is Charmed and Incapacitated, aware of nothing but your voice. While it lasts you can erase, sharpen, rewrite, or invent its memory of one event from the last 24 hours that took no more than 10 minutes. Damage or another spell breaks the effect and leaves the memory untouched."}}, {column: {name: at_higher_levels, value: "You can alter the target's memories of an event that took place up to 7 days ago (level 6 spell slot), 30 days ago (level 7 spell slot), 365 days ago (level 8 spell slot), or any time in the creature's past (level 9 spell slot)."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-00000000001a"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Passwall"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "1 hour"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a pinch of sesame seeds"}}, {column: {name: description, value: "An opening up to 5 feet wide, 8 feet tall, and 20 feet deep appears in a wooden, plaster, or stone surface, leaving the structure around it stable. Anything still inside when the passage closes is safely ejected to the nearest unoccupied space."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-00000000001b"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Planar Binding"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "ABJURATION"}}, {column: {name: casting_time, value: "1 hour"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "24 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a jewel worth 1,000+ GP, consumed"}}, {column: {name: description, value: "An hour of ritual binds a Celestial, Elemental, Fey, or Fiend — typically one already trapped by an inverted Magic Circle — to your service on a failed Charisma saving throw. It follows your commands as best it can for 24 hours, and a Hostile one will twist them toward its own ends."}}, {column: {name: at_higher_levels, value: "The duration increases with a spell slot of level 6 (10 days), 7 (30 days), 8 (180 days), and 9 (366 days)."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-00000000001c"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Raise Dead"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "1 hour"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a diamond worth 500+ GP, consumed"}}, {column: {name: description, value: "Return a creature dead no more than 10 days, and not Undead when it died, to life with 1 Hit Point. Poisons are neutralized and mortal wounds close, but missing body parts stay missing and the spell fails outright without them. The target takes a -4 penalty to D20 Tests that drops by 1 with each Long Rest."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-00000000001d"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Reincarnate"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "NECROMANCY"}}, {column: {name: casting_time, value: "1 hour"}}, {column: {name: range, value: "Touch"}}, {column: {name: duration, value: "Instantaneous"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "rare oils worth 1,000+ GP, consumed"}}, {column: {name: description, value: "Touch a Humanoid dead no longer than 10 days, or a piece of one, and the spell builds a new body — species by a 1d10 roll or the GM's choice — and calls the soul into it. It remembers its old life and keeps its capabilities, trading its former species traits for those of the new one."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-00000000001e"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Scrying"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "10 minutes"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a focus worth 1,000+ GP, such as a crystal ball, mirror, or water-filled font"}}, {column: {name: description, value: "See and hear a creature on your plane through an Invisible sensor that stays within 10 feet of it. Its Wisdom saving throw is modified by how well you know it and what you hold of it, from +5 for hearsay down to -10 for a body part or lock of hair. You can target a place you have seen instead, and the sensor stays put."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-00000000001f"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Seeming"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "ILLUSION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "8 hours"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Give any number of creatures you can see an illusory appearance — build, features, clothing, and gear, up to a foot shorter or taller — with a Charisma saving throw for the unwilling. The disguise does not hold up to touch, and a creature that Studies a target can see through it with an Intelligence (Investigation) check against your spell save DC."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000020"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Summon Dragon"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Concentration, up to 1 hour"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "an object with the image of a dragon engraved on it worth 500+ GP"}}, {column: {name: description, value: "A Dragon spirit manifests in an unoccupied space within range and fights as your ally, using the Draconic Spirit stat block. It shares your Initiative and acts immediately after you, obeying your spoken commands and taking the Dodge action if you give none."}}, {column: {name: at_higher_levels, value: "Use the spell slot's level for the spell's level in the stat block."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000021"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Telekinesis"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "TRANSMUTATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "60 feet"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Move a creature or object by thought, exerting your will again each turn on the same target or a new one. A Huge or smaller creature that fails a Strength saving throw is moved up to 30 feet and left Restrained until the end of your next turn; an unattended object of that size moves freely, and a carried one is torn away on a failed save."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000022"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Telepathic Bond"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "DIVINATION"}}, {column: {name: casting_time, value: "Action or Ritual"}}, {column: {name: range, value: "30 feet"}}, {column: {name: duration, value: "1 hour"}}, {column: {name: ritual, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "two eggs"}}, {column: {name: description, value: "Link up to eight willing creatures so that each can speak mind to mind with all the others, whether or not they share a language. The bond reaches any distance on the same plane of existence but does not cross to another."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000023"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Teleportation Circle"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "1 minute"}}, {column: {name: range, value: "10 feet"}}, {column: {name: duration, value: "1 round"}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "rare inks worth 50+ GP, consumed"}}, {column: {name: description, value: "Draw a 5-foot-radius circle of sigils that opens a portal to a permanent teleportation circle whose sigil sequence you know, on your own plane. The portal stays open until the end of your next turn. Casting the spell in the same place every day for 365 days makes the circle itself permanent."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000024"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Tree Stride"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "CONJURATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "Self"}}, {column: {name: duration, value: "Concentration, up to 1 minute"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: description, value: "Step into a living tree at least your size and out of another of the same kind within 500 feet, at a cost of 5 feet of movement each way. You know where every such tree is, but you can only travel once per turn and must end each turn outside a tree."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000025"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Wall of Force"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a shard of glass"}}, {column: {name: description, value: "An Invisible wall a quarter inch thick springs up in any orientation: a dome or globe up to 10 feet in radius, or ten contiguous 10-foot panels. Nothing physically passes through it, it takes no damage and ignores Dispel Magic, and it blocks ethereal travel. Only Disintegrate destroys it."}}]}
        - insert: {tableName: spells, columns: [{column: {name: id, value: "5be20000-0000-4000-a000-000000000026"}}, {column: {name: created_at, valueComputed: "now()"}}, {column: {name: updated_at, valueComputed: "now()"}}, {column: {name: version, valueNumeric: 0}}, {column: {name: name, value: "Wall of Stone"}}, {column: {name: level, valueNumeric: 5}}, {column: {name: school, value: "EVOCATION"}}, {column: {name: casting_time, value: "Action"}}, {column: {name: range, value: "120 feet"}}, {column: {name: duration, value: "Concentration, up to 10 minutes"}}, {column: {name: concentration, valueBoolean: true}}, {column: {name: verbal_component, valueBoolean: true}}, {column: {name: somatic_component, valueBoolean: true}}, {column: {name: material_component, valueBoolean: true}}, {column: {name: materials, value: "a cube of granite"}}, {column: {name: description, value: "Ten contiguous 10-foot panels of stone 6 inches thick appear where you choose, merged with and supported by existing stone — a bridge, a ramp, a barrier, or an enclosure. Creatures in the way are pushed aside, and anyone about to be sealed in gets a Dexterity saving throw to escape. Hold Concentration for the full duration and the wall becomes permanent."}}]}
